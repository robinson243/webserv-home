server {
    listen 8080;
    server_name 127.0.0.1;

    root ./www/temp2;
    index index.html;

    location / {
        allowed_methods GET;
    }

    location /post_body {
        root ./www;
        allowed_methods POST;
        client_max_body_size 1000;
    }

    location /directory {
        root ./YoupiBanane;
        allowed_methods GET POST DELETE;
        index youpi.bad_extension;
        cgi_extension .bla cgi_tester;
    }
}


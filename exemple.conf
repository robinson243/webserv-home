server {
    listen 127.0.0.1:8080;

    server_name temp.com;

    root /home/ydembele/42Project/webserv/www/temp;
    index index.html;

    client_max_body_size 1000000;

    location / {
        allow_methods GET POST DELETE;
        autoindex off;
    }
}



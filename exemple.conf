server {
    listen 8080;
    server_name localhost;
    root /home/oamairi/42Stud/GitHub/webserv;
    index index.html;

    location / {
        allowed_methods GET;
    }

    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
    }

    location /directory {
        allowed_methods GET;
        root /home/oamairi/42Stud/GitHub/webserv/YoupiBanane;
        index youpi.bad_extension;
    }

    location /home/oamairi/42Stud/GitHub/webserv/YoupiBanane {
        allowed_methods POST;
        cgi_extension .bla /home/oamairi/42Stud/GitHub/webserv/cgi_tester;
    }
}
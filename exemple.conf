server {
    listen 8080;

    # / → GET uniquement
    location / {
        allow_methods GET;
        root /home/romukena/Documents/webserv/www;
        index index.html;
    }

    # Tout fichier .bla → POST via CGI cgi_test
    location /home/romukena/Documents/webserv/*.bla {
        allow_methods POST;
        cgi .bla ./cgi_test;
    }

    # /post_body → POST avec body max 100 octets
    location /post_body {
        allow_methods POST GET DELETE;
        client_max_body_size 100;
    }

    # /directory/ → GET, root = YoupiBanane, index par défaut = youpi.bad_extension
    location /directory/ {
        allow_methods GET;
        root /home/romukena/Documents/webserv/YoupiBanane;
        index youpi.bad_extension;
    }
}